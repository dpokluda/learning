[package]
name = "crate_drills"
version = "0.1.0"
edition = "2024"
publish = false

# Every version here is pinned to what the book was written and verified
# against. `cargo build` will fetch these once; after that `cargo test --offline`
# works with no network at all.

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.5", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env", "test"] }
reqwest = { version = "0.13.4", features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
